# Canonical deployment for the public Janavani brochure website.
# Only the reviewed main branch can publish a public Pages artifact.
name: Deploy Janavani Website to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Stage and validate public website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage allowlisted public files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/brand/favicon
          mkdir -p _site/assets/brand/logos
          mkdir -p _site/assets/images

          cp index.html about.html how-it-works.html resources.html vision.html contact.html 404.html _site/
          cp styles-rebuild.css script-rebuild.js gtranslation-new.js _site/
          cp robots.txt sitemap.xml site.webmanifest _site/

          # Copy only assets referenced by the production HTML/CSS/manifest.
          cp assets/brand/favicon/janavani-mark.svg _site/assets/brand/favicon/
          cp "assets/brand/logos/JanaVani Profile Pictures re-size svg.svg" _site/assets/brand/logos/
          cp "assets/brand/logos/JanaVani Profile Pictures re-size.png" _site/assets/brand/logos/
          cp "assets/images/janavani-home-hero-citizen-voice - webp.webp" _site/assets/images/

          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Validate metadata, encoding, links, and artifact allowlist
        run: python scripts/validate_public_site.py --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy verified artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
